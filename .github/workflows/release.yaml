name: Release

on:
  push:
    tags:
      - V*.*
      - v*.*

jobs:
  build:
    uses: ./.github/workflows/reusable-build.yml
    with:
      version: ${{ github.ref_name }}

  release:
    runs-on: windows-latest
    needs: build
    permissions:
      contents: write
      actions: write
    steps:
      - name: Checkout release metadata
        uses: actions/checkout@main

      - name: Verify release notes
        shell: pwsh
        run: |
          $releaseNotesPath = "release-notes/${{ github.ref_name }}.md"
          if (-not (Test-Path -LiteralPath $releaseNotesPath -PathType Leaf)) {
            throw "Missing required user-facing release notes: $releaseNotesPath"
          }

      - name: Download Artifact
        uses: actions/download-artifact@main
        with:
          path: release/
          merge-multiple: true

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          files: |
            release/*
          target_commitish: ${{ github.sha }}
          body_path: release-notes/${{ github.ref_name }}.md
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_unmatched_files: true

      - name: Trigger MirrorChyanUploading
        shell: bash
        run: |
          gh workflow run --repo $GITHUB_REPOSITORY mirrorchyan_release -f tag=${{ github.ref_name }}
          gh workflow run --repo $GITHUB_REPOSITORY mirrorchyan_release_note -f tag=${{ github.ref_name }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}